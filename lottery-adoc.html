<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ADOC - Lotería Black Friday</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-x: hidden;
        }

        .container {
            max-width: 900px;
            width: 100%;
            animation: fadeIn 1s ease-out;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
        }

        h1 {
            font-size: clamp(2rem, 6vw, 3.5rem);
            font-weight: 300;
            letter-spacing: 0.3em;
            margin-bottom: 10px;
            background: linear-gradient(90deg, #fff, #ffd700, #fff);
            background-size: 200% 100%;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shimmer 3s infinite;
        }

        .subtitle {
            font-size: clamp(0.9rem, 2vw, 1.1rem);
            font-weight: 300;
            letter-spacing: 0.2em;
            color: #ffd700;
            text-transform: uppercase;
            margin-bottom: 20px;
        }

        .instructions {
            background: rgba(255, 215, 0, 0.1);
            border: 1px solid rgba(255, 215, 0, 0.3);
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 30px;
            text-align: center;
        }

        .instructions p {
            font-size: 0.95rem;
            line-height: 1.6;
            color: #ddd;
        }

        .game-board {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-bottom: 30px;
            max-width: 700px;
            margin-left: auto;
            margin-right: auto;
        }

        .scratch-card {
            aspect-ratio: 1;
            background: #1a1a1a;
            border: 2px solid #333;
            border-radius: 15px;
            position: relative;
            cursor: pointer;
            overflow: hidden;
            transition: transform 0.2s;
        }

        .scratch-card:hover {
            transform: scale(1.05);
        }

        .scratch-card.scratched {
            border-color: #ffd700;
            animation: reveal 0.5s ease-out;
        }

        .card-back {
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, #2a2a2a 0%, #1a1a1a 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            color: #444;
            user-select: none;
            transition: opacity 0.3s;
        }

        .card-back::before {
            content: '';
            position: absolute;
            inset: 0;
            background:
                repeating-linear-gradient(45deg, transparent, transparent 10px, rgba(255, 255, 255, 0.03) 10px, rgba(255, 255, 255, 0.03) 20px);
        }

        .card-front {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 15px;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .scratch-card.scratched .card-back {
            opacity: 0;
            pointer-events: none;
        }

        .scratch-card.scratched .card-front {
            opacity: 1;
        }

        .brand-name {
            font-size: clamp(0.8rem, 2vw, 1.1rem);
            font-weight: 700;
            text-align: center;
            color: #ffd700;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        .controls {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 30px;
        }

        .btn {
            background: linear-gradient(135deg, #ffd700 0%, #ffed4e 100%);
            color: #000;
            border: none;
            padding: 18px 40px;
            font-size: 1.1rem;
            font-weight: 600;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 20px rgba(255, 215, 0, 0.3);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 30px rgba(255, 215, 0, 0.5);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn-secondary {
            background: transparent;
            color: #ffd700;
            border: 2px solid #ffd700;
            box-shadow: none;
        }

        .btn-secondary:hover {
            background: rgba(255, 215, 0, 0.1);
        }

        .result {
            text-align: center;
            padding: 30px;
            border-radius: 15px;
            margin-bottom: 20px;
            opacity: 0;
            transform: scale(0.9);
            transition: all 0.5s;
            display: none;
        }

        .result.show {
            opacity: 1;
            transform: scale(1);
            display: block;
        }

        .result.winner {
            background: linear-gradient(135deg, rgba(255, 215, 0, 0.2) 0%, rgba(255, 237, 78, 0.1) 100%);
            border: 2px solid #ffd700;
        }

        .result.loser {
            background: rgba(136, 136, 136, 0.1);
            border: 2px solid #444;
        }

        .result h2 {
            font-size: clamp(1.5rem, 4vw, 2.5rem);
            margin-bottom: 15px;
            letter-spacing: 0.1em;
        }

        .result.winner h2 {
            color: #ffd700;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
        }

        .result p {
            font-size: clamp(1rem, 2.5vw, 1.3rem);
            line-height: 1.6;
        }

        .prize-code {
            background: #000;
            padding: 15px 30px;
            border-radius: 10px;
            border: 2px dashed #ffd700;
            margin: 20px 0;
            font-size: 1.5rem;
            letter-spacing: 0.3em;
            font-weight: bold;
            color: #ffd700;
        }

        .stats {
            text-align: center;
            color: #888;
            font-size: 0.9rem;
            margin-bottom: 20px;
        }

        .turns-info {
            text-align: center;
            color: #ffd700;
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 20px;
        }

        footer {
            text-align: center;
            margin-top: 40px;
            padding: 20px;
            color: #555;
            font-size: 0.85rem;
            letter-spacing: 0.1em;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        @keyframes shimmer {

            0%,
            100% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }
        }

        @keyframes reveal {
            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.1);
            }

            100% {
                transform: scale(1);
            }
        }

        @media (max-width: 768px) {
            .game-board {
                grid-template-columns: repeat(3, 1fr);
                gap: 10px;
            }

            .card-back {
                font-size: 2rem;
            }

            .btn {
                padding: 15px 30px;
                font-size: 1rem;
            }

            .brand-name {
                font-size: 0.7rem;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <header>
            <h1>ADOC</h1>
            <p class="subtitle">Lotería Black Friday</p>
        </header>

        <div class="instructions">
            <p>🎰 <strong>Raspa las tarjetas</strong> y descubre tu premio<br>
                🎁 <strong>3 marcas iguales</strong> = ¡Descuento especial!<br>
                🎮 <strong>5 turnos disponibles</strong> para encontrar el trío ganador<br>
                ⭐ ¡Buena suerte!</p>
        </div>

        <div class="turns-info" id="turnsInfo">
            Turnos restantes: <strong>5</strong>
        </div>

        <div class="stats" id="stats">
            Tarjetas raspadas: <strong>0/12</strong>
        </div>

        <div class="game-board" id="gameBoard"></div>

        <div class="result" id="result"></div>

        <div class="controls">
            <button class="btn" id="playBtn" onclick="startGame()">🎮 Jugar Ahora</button>
            <button class="btn btn-secondary" id="resetBtn" onclick="resetGame()" style="display: none;">🔄 Jugar de
                Nuevo</button>
        </div>

        <footer>
            BLACK FRIDAY 2024 © ADOC
        </footer>
    </div>

    <script>
        const brands = [
            { name: 'ADOC' },
            { name: 'PAR2' },
            { name: 'HUSH PUPPIES' },
            { name: 'CAT' },
            { name: 'THE NORTH FACE' },
            { name: 'MERRELL' },
            { name: 'PUNTOS ADOC' },
            { name: 'COLUMBIA' },
            { name: 'TIMBERLAND' }
        ];

        const prizes = {
            'ADOC': '30% de descuento en toda la tienda ADOC',
            'PAR2': '25% de descuento en calzado PAR2',
            'HUSH PUPPIES': '20% de descuento en Hush Puppies',
            'CAT': '25% de descuento en productos CAT',
            'THE NORTH FACE': '20% de descuento en The North Face',
            'MERRELL': '25% de descuento en Merrell',
            'PUNTOS ADOC': '500 Puntos ADOC gratis',
            'COLUMBIA': '20% de descuento en Columbia',
            'TIMBERLAND': '25% de descuento en Timberland'
        };

        let selectedBrands = [];
        let scratchedCount = 0;
        let turnsRemaining = 5;
        let gameStarted = false;

        function startGame() {
            gameStarted = true;
            scratchedCount = 0;
            turnsRemaining = 5;
            selectedBrands = [];

            // Crear 12 tarjetas con mayor probabilidad de tríos (50%)
            if (Math.random() < 0.5) {
                // Ganador: garantizar un trío
                const winningBrand = brands[Math.floor(Math.random() * brands.length)];
                selectedBrands = [winningBrand, winningBrand, winningBrand];

                // Llenar las demás con marcas aleatorias
                while (selectedBrands.length < 12) {
                    selectedBrands.push(brands[Math.floor(Math.random() * brands.length)]);
                }
            } else {
                // No ganador: sin tríos completos
                for (let i = 0; i < 12; i++) {
                    selectedBrands.push(brands[Math.floor(Math.random() * brands.length)]);
                }
            }

            // Mezclar las posiciones
            selectedBrands.sort(() => Math.random() - 0.5);

            renderBoard();
            document.getElementById('playBtn').style.display = 'none';
            document.getElementById('result').classList.remove('show');
            updateStats();
            updateTurns();
        }

        function renderBoard() {
            const board = document.getElementById('gameBoard');
            board.innerHTML = '';

            selectedBrands.forEach((brand, index) => {
                const card = document.createElement('div');
                card.className = 'scratch-card';
                card.innerHTML = `
                    <div class="card-back">?</div>
                    <div class="card-front">
                        <div class="brand-name">${brand.name}</div>
                    </div>
                `;
                card.onclick = () => scratchCard(card, index);
                board.appendChild(card);
            });
        }

        function scratchCard(card, index) {
            if (!gameStarted || card.classList.contains('scratched')) return;

            card.classList.add('scratched');
            scratchedCount++;
            updateStats();

            // Revisar resultado después de cada raspada
            setTimeout(() => {
                const result = checkResult();
                if (result) {
                    gameStarted = false;
                }
            }, 500);

            // Actualizar turnos cada 3 tarjetas
            if (scratchedCount % 3 === 0 && scratchedCount > 0) {
                turnsRemaining--;
                updateTurns();

                if (turnsRemaining === 0 && !checkResult()) {
                    setTimeout(() => {
                        gameStarted = false;
                        showNoWinMessage();
                    }, 800);
                }
            }
        }

        function updateStats() {
            document.getElementById('stats').innerHTML =
                `Tarjetas raspadas: <strong>${scratchedCount}/12</strong>`;
        }

        function updateTurns() {
            document.getElementById('turnsInfo').innerHTML =
                `Turnos restantes: <strong>${turnsRemaining}</strong>`;
        }

        function checkResult() {
            const scratchedCards = Array.from(document.querySelectorAll('.scratch-card.scratched'));
            const scratchedBrands = scratchedCards.map((card, idx) => {
                const index = Array.from(document.querySelectorAll('.scratch-card')).indexOf(card);
                return selectedBrands[index].name;
            });

            // Contar ocurrencias de cada marca
            const brandCounts = {};
            scratchedBrands.forEach(brand => {
                brandCounts[brand] = (brandCounts[brand] || 0) + 1;
            });

            // Buscar si hay 3 o más de la misma marca
            const winningBrand = Object.keys(brandCounts).find(brand => brandCounts[brand] >= 3);

            const resultDiv = document.getElementById('result');

            if (winningBrand) {
                const prize = prizes[winningBrand];
                const code = generateCode();

                resultDiv.className = 'result winner show';
                resultDiv.innerHTML = `
                    <h2>🎉 ¡FELICIDADES! 🎉</h2>
                    <p>Has encontrado 3 <strong>${winningBrand}</strong><br>Has ganado:<br><strong>${prize}</strong></p>
                    <div class="prize-code">${code}</div>
                    <p style="font-size: 0.9rem; color: #aaa;">Presenta este código en cualquier tienda ADOC</p>
                `;
                document.getElementById('resetBtn').style.display = 'block';
                return true;
            } else if (turnsRemaining === 0) {
                resultDiv.className = 'result loser show';
                resultDiv.innerHTML = `
                    <h2>¡Casi!</h2>
                    <p>No obtuviste 3 marcas iguales en esta partida.<br>¡Intenta de nuevo y gana increíbles descuentos!</p>
                `;
                document.getElementById('resetBtn').style.display = 'block';
                return true;
            }

            return false;
        }

        function generateCode() {
            const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
            let code = '';
            for (let i = 0; i < 8; i++) {
                code += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return code.match(/.{1,4}/g).join('-');
        }

        function resetGame() {
            gameStarted = false;
            scratchedCount = 0;
            turnsRemaining = 5;
            selectedBrands = [];

            document.getElementById('gameBoard').innerHTML = '';
            document.getElementById('playBtn').style.display = 'block';
            document.getElementById('resetBtn').style.display = 'none';
            document.getElementById('result').classList.remove('show');
            document.getElementById('stats').innerHTML = 'Tarjetas raspadas: <strong>0/12</strong>';
            document.getElementById('turnsInfo').innerHTML = 'Turnos restantes: <strong>5</strong>';
        }
    </script>
</body>

</html>
